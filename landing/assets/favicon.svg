<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- XP-style 3D icon background - blue gradient like XP icons -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3a93ff"/>
      <stop offset="100%" style="stop-color:#0058e6"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6dd66d"/>
      <stop offset="50%" style="stop-color:#44a843"/>
      <stop offset="100%" style="stop-color:#2d8e2c"/>
    </linearGradient>
    <linearGradient id="broom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff4a0"/>
      <stop offset="100%" style="stop-color:#c8a000"/>
    </linearGradient>
  </defs>
  <!-- Outer square with XP rounded corners -->
  <rect x="1" y="1" width="30" height="30" rx="4" fill="url(#bg)" stroke="#003399" stroke-width="1"/>
  <!-- Inner highlight -->
  <rect x="2" y="2" width="28" height="14" rx="3" fill="rgba(255,255,255,0.2)"/>
  <!-- Shield shape -->
  <path d="M16 5 L9 8 L9 15 C9 20 16 25 16 25 C16 25 23 20 23 15 L23 8 Z" fill="url(#shield)" stroke="#1a6b1a" stroke-width="0.8"/>
  <!-- Shield highlight -->
  <path d="M16 6 L10 8.5 L10 14 C10 14 10 9 16 6Z" fill="rgba(255,255,255,0.3)"/>
  <!-- Checkmark on shield -->
  <polyline points="12.5,15 15,17.5 20,12.5" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Small broom accent -->
  <line x1="22" y1="22" x2="26" y2="26" stroke="#8B4513" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M25 25 L27 24 L28 26 L26 27 Z" fill="url(#broom)" stroke="#8B4513" stroke-width="0.5"/>
</svg>
